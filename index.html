<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>軌跡データ収集 (RNN学習用)</title>
<style>
  :root {
    --canvas-size: min(90vw, 90vh, 700px);
    --accent: #2563eb;
    --danger: #dc2626;
    --ink: #111827;
    --muted: #6b7280;
    --bg: #f3f4f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    /* ページ全体のtouch-action:noneはやめる（キャンバス外のスクロールが
       できなくなり、あるところまでスクロールすると戻れなくなるバグの原因だった）。
       スクロール抑止はキャンバス自体(#canvasWrap / #drawCanvas)だけに絞る。 */
    overscroll-behavior: none;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    min-height: 100%;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 4px 0 0;
    color: var(--muted);
  }
  .meta-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .meta-row input[type="text"] {
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    width: 200px;
  }
  .mode-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    border: 2px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    color: #374151;
    background: #e5e7eb;
  }
  .mode-btn.active {
    color: #fff;
    background: #0ea5e9;
    border-color: #0369a1;
  }
  #canvasWrap {
    position: relative;
    width: var(--canvas-size);
    height: var(--canvas-size);
    background: #ffffff;
    border: 2px solid #111827;
    border-radius: 12px;
    touch-action: none;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  #canvasWrap.ruler-mode {
    border-color: #0ea5e9;
  }
  #drawCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
  }
  #recBadge {
    position: absolute;
    top: 10px;
    right: 12px;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.85);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    pointer-events: none;
    z-index: 5;
  }
  #recBadge.on { display: flex; }
  #recBadge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    background: var(--accent);
  }
  button.secondary { background: #4b5563; }
  button.danger { background: var(--danger); }
  button.playback { background: #7c3aed; }
  button.add { background: #059669; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:active { opacity: 0.8; }
  #status {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    min-height: 18px;
  }
  #familyPanel {
    width: var(--canvas-size);
    max-width: 100%;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
  }
  #familyHeader {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  #familyList {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
    margin-bottom: 8px;
  }
  .family-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 6px;
    background: #f9fafb;
  }
  .family-item.editing-locked { opacity: 0.45; }
  .family-item canvas.thumb {
    width: 40px;
    height: 40px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    background: #fff;
    flex-shrink: 0;
  }
  .family-item .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .family-item .label { flex: 1; color: var(--ink); }
  .family-item button {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: 6px;
  }
  .family-item button.play { background: #7c3aed; }
  .family-item button.edit { background: #4b5563; }
  .family-item button.del { background: var(--danger); }
  #exportBtn { width: 100%; }
  #editBanner {
    width: var(--canvas-size);
    max-width: 100%;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  #log {
    width: var(--canvas-size);
    max-width: 100%;
    font-size: 11px;
    color: var(--muted);
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>
<div class="app">
  <h1>軌跡データ収集ツール（研究用 / RNN学習データ作成）</h1>

  <div class="meta-row">
    <input id="labelInput" type="text" placeholder="ラベル / セッションID（任意）">
  </div>

  <div class="mode-row">
    <button id="modeDrawBtn" class="mode-btn active">✏️ 描画モード</button>
    <button id="modeRulerBtn" class="mode-btn">📐 ルーラーモード</button>
    <button id="rulerClearBtn" class="secondary">ルーラー削除</button>
  </div>

  <div id="canvasWrap">
    <canvas id="drawCanvas"></canvas>
    <div id="recBadge"><span class="dot"></span>REC</div>
  </div>

  <div id="status">Strokes: <span id="strokeCount">0</span> &nbsp;|&nbsp; Timesteps: <span id="pointCount">0</span> &nbsp;|&nbsp; Elapsed: <span id="elapsed">0.00</span>s</div>

  <div class="controls">
    <button id="undoBtn" class="secondary">元に戻す</button>
    <button id="clearBtn" class="danger">全消去</button>
    <button id="playBtn" class="playback">▶ 再生</button>
    <button id="addBtn" class="add">＋ Familyに追加</button>
    <button id="editConfirmBtn" class="add" style="display:none;">✓ 編集を確定</button>
    <button id="editCancelBtn" class="secondary" style="display:none;">✕ 編集をキャンセル</button>
  </div>
  <div id="editBanner" style="display:none;"></div>

  <div id="familyPanel">
    <div id="familyHeader">Family: <span id="familyCount">0</span> seqs / <span id="familyTimesteps">0</span> timesteps</div>
    <div id="familyList"></div>
    <button id="exportBtn">Familyを書き出す (JSON)</button>
  </div>

  <div id="log"></div>
</div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // 設定値
  // ------------------------------------------------------------------
  const TARGET_RANGE = 0.9; // tanh飽和を避けるため ±0.9 に収める
  const MAX_POINTS_PER_FRAME_LOG = false;
  // Familyメンバーを見分けるための薄色パレット（順番に使い回す）
  const FAMILY_COLORS = ["#2563eb", "#059669", "#d97706", "#db2777", "#7c3aed", "#0891b2", "#dc2626", "#65a30d"];

  const canvas = document.getElementById("drawCanvas");
  const ctx = canvas.getContext("2d", { desynchronized: true });
  const wrap = document.getElementById("canvasWrap");
  const statusStrokeCount = document.getElementById("strokeCount");
  const statusPointCount = document.getElementById("pointCount");
  const statusElapsed = document.getElementById("elapsed");
  const logEl = document.getElementById("log");
  const labelInput = document.getElementById("labelInput");
  const recBadge = document.getElementById("recBadge");
  const undoBtn = document.getElementById("undoBtn");
  const clearBtn = document.getElementById("clearBtn");
  const addBtn = document.getElementById("addBtn");
  const exportBtn = document.getElementById("exportBtn");
  const playBtn = document.getElementById("playBtn");
  const editConfirmBtn = document.getElementById("editConfirmBtn");
  const editCancelBtn = document.getElementById("editCancelBtn");
  const editBanner = document.getElementById("editBanner");
  const familyCountEl = document.getElementById("familyCount");
  const familyTimestepsEl = document.getElementById("familyTimesteps");
  const familyListEl = document.getElementById("familyList");
  const modeDrawBtn = document.getElementById("modeDrawBtn");
  const modeRulerBtn = document.getElementById("modeRulerBtn");
  const rulerClearBtn = document.getElementById("rulerClearBtn");

  let cssSize = 0;       // CSS上のキャンバス一辺の長さ(px)
  let dpr = window.devicePixelRatio || 1;

  // 記録データ本体: strokes = [ {pointerType, points: [...]} , ... ]  <- 今まさに描いている「下書き」
  let strokes = [];
  let currentStroke = null;
  let activePointerId = null;
  let isPlaying = false; // 再生中は新規描画・他ボタンを無効化する
  let strokeStartPerf = null; // 現在のストローク開始時刻(performance.now())
  let liveTickRunning = false;  // 経過時間・timestepsのライブ更新ループが動いているか

  // Family: ＋ボタンで確定した(下書きから昇格した)シーケンス群。
  // 各要素が1つの(T,2)シーケンス。書き出すと(T, Nseq, 2)相当のデータになる。
  // family = [ {id, color, pointerType, points: [...]} , ... ]
  let family = [];
  let familyIdCounter = 0;
  let editingId = null;       // 編集中のFamilyメンバーのid（null = 編集中でない）
  let editingOriginal = null; // キャンセル時に復元するための編集前スナップショット {id,color,pointerType,points,listIndex}

  // ------------------------------------------------------------------
  // ルーラー（ステンシルのように、自分で描いた形の"内側"には描画できない
  // 移動可能なガイド）。記録データ(t,x,y)には一切含まれない、あくまでUI上のガイド。
  // ------------------------------------------------------------------
  let mode = "draw"; // "draw" | "ruler"
  let ruler = null;  // { points: [{x_px,y_px}, ...], offsetX, offsetY } | null
  let rulerDragPointerId = null;
  let rulerDragMode = null;      // "move" | "draw"
  let rulerDraftPoints = null;   // ルーラーの形を新規に描いている間の一時点列
  let rulerDragStart = null;     // {x,y} 移動開始時のポインタ位置
  let rulerOffsetStart = null;   // {x,y} 移動開始時のruler.offset

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
  }

  // ------------------------------------------------------------------
  // キャンバスのセットアップ（正方形・原点中心の座標系を固定するため）
  // ------------------------------------------------------------------
  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    cssSize = rect.width; // wrapは正方形なのでwidth=height
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }
  window.addEventListener("resize", resizeCanvas);

  // ------------------------------------------------------------------
  // 正規化: キャンバスの描画可能範囲(正方形・原点中心)を [-0.9, 0.9] に写す
  // これによりデータセット全体のmin/maxに依存しない「既知の固定変換」になる。
  // y軸は画面下向き正 -> 数学的な上向き正に反転しておく。
  // ------------------------------------------------------------------
  function toNormalized(xPx, yPx) {
    const half = cssSize / 2;
    let xNorm = ((xPx - half) / half) * TARGET_RANGE;
    let yNorm = -((yPx - half) / half) * TARGET_RANGE;
    // 境界丸め誤差対策のclamp
    xNorm = Math.max(-1, Math.min(1, xNorm));
    yNorm = Math.max(-1, Math.min(1, yNorm));
    return [xNorm, yNorm];
  }

  function getLocalPos(evt) {
    const rect = canvas.getBoundingClientRect();
    return [evt.clientX - rect.left, evt.clientY - rect.top];
  }

  // ------------------------------------------------------------------
  // 描画（見た目のフィードバック用。記録データとは独立）
  // ------------------------------------------------------------------
  function drawSegment(p0, p1) {
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.lineTo(p1[0], p1[1]);
    ctx.stroke();
  }

  // 保存済みの点列をまとめて描く（Familyのうっすら表示・アクティブな下書きの再描画に使用）
  function drawPolyline(points, color, alpha) {
    if (points.length < 2) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(points[0].x_px, points[0].y_px);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x_px, points[i].y_px);
    ctx.stroke();
    ctx.restore();
  }

  // 正規化座標 -> ピクセル座標（toNormalizedの逆変換。グリッド線を引くために使う）
  function fromNormalized(xNorm, yNorm) {
    const half = cssSize / 2;
    const xPx = (xNorm / TARGET_RANGE) * half + half;
    const yPx = half - (yNorm / TARGET_RANGE) * half;
    return [xPx, yPx];
  }

  // ラフな座標グリッド（目盛りは0.3刻み。正確さより「だいたいの位置感覚」重視）
  function drawGuides() {
    const ticks = [-0.9, -0.6, -0.3, 0, 0.3, 0.6, 0.9];
    ctx.save();
    ctx.font = "10px -apple-system, sans-serif";
    ctx.fillStyle = "#9ca3af";
    ctx.textBaseline = "top";

    for (const v of ticks) {
      const [xPx] = fromNormalized(v, 0);
      const [, yPx] = fromNormalized(0, v);
      const isOrigin = v === 0;

      ctx.strokeStyle = isOrigin ? "#d1d5db" : "#eef0f3";
      ctx.lineWidth = isOrigin ? 1.5 : 1;

      ctx.beginPath();
      ctx.moveTo(xPx, 0); ctx.lineTo(xPx, cssSize);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, yPx); ctx.lineTo(cssSize, yPx);
      ctx.stroke();

      ctx.fillText(v.toFixed(1), xPx + 2, 2);
      ctx.fillText(v.toFixed(1), 2, yPx + 2);
    }
    ctx.restore();
  }

  function redrawAll() {
    ctx.clearRect(0, 0, cssSize, cssSize);
    drawGuides();

    // Familyメンバーはうっすら色付きで（過去に何を描いたか分かるように）
    for (const m of family) {
      drawPolyline(m.points, m.color, 0.35);
    }
    // 今アクティブな下書きは濃い黒で上から重ねる
    for (const s of strokes) {
      drawPolyline(s.points, "#111827", 1);
    }
    drawRulerOverlay(); // ルーラーは一番上に重ねて、どこが描けないか常に見えるようにする
  }

  // ------------------------------------------------------------------
  // ルーラー: 内側判定・描画・移動
  // ------------------------------------------------------------------

  // レイキャスト法による点内外判定。pointsは絶対ピクセル座標(x_px,y_px)の配列。
  function pointInPolygon(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      const xi = points[i].x_px, yi = points[i].y_px;
      const xj = points[j].x_px, yj = points[j].y_px;
      const intersect = (yi > y) !== (yj > y) &&
        x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function getRulerAbsolutePoints() {
    if (!ruler) return [];
    return ruler.points.map((p) => ({ x_px: p.x_px + ruler.offsetX, y_px: p.y_px + ruler.offsetY }));
  }

  function isInsideRuler(xPx, yPx) {
    if (!ruler) return false;
    return pointInPolygon(xPx, yPx, getRulerAbsolutePoints());
  }

  function drawRulerPolygon(points, closeAndFill) {
    if (points.length < 2) return;
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "#0ea5e9";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(points[0].x_px, points[0].y_px);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x_px, points[i].y_px);
    if (closeAndFill) {
      ctx.closePath();
      ctx.fillStyle = "rgba(14,165,233,0.15)";
      ctx.fill();
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawRulerOverlay() {
    if (ruler) drawRulerPolygon(getRulerAbsolutePoints(), true);
    if (rulerDragMode === "draw" && rulerDraftPoints && rulerDraftPoints.length > 1) {
      drawRulerPolygon(rulerDraftPoints, false);
    }
  }

  // ------------------------------------------------------------------
  // ポインタイベント（Apple Pencil / 指 / マウス）
  // ------------------------------------------------------------------
  function makePoint(evt, xPx, yPx) {
    const [xNorm, yNorm] = toNormalized(xPx, yPx);
    const point = {
      t: evt.timeStamp,           // DOMHighResTimeStamp (ms, 単調増加, 高分解能)
      x: xNorm,                   // 正規化済み [-0.9, 0.9] (主データ)
      y: yNorm,
      x_px: xPx,                  // 生のキャンバス内ピクセル座標（デバッグ・再変換用）
      y_px: yPx,
      pressure: evt.pressure ?? 0,
    };
    if (typeof evt.tiltX === "number") point.tiltX = evt.tiltX;
    if (typeof evt.tiltY === "number") point.tiltY = evt.tiltY;
    if (typeof evt.altitudeAngle === "number") point.altitudeAngle = evt.altitudeAngle;
    if (typeof evt.azimuthAngle === "number") point.azimuthAngle = evt.azimuthAngle;
    return point;
  }

  function onPointerDown(evt) {
    if (isPlaying) return;              // 再生中はペン入力を無視
    if (activePointerId !== null) return; // 同時多点は無視（1本ずつ記録）
    const [xPx, yPx] = getLocalPos(evt);
    if (isInsideRuler(xPx, yPx)) return; // ルーラーの内側にはペンを置けない（ステンシル）

    evt.preventDefault();
    canvas.setPointerCapture(evt.pointerId);
    activePointerId = evt.pointerId;
    recBadge.classList.add("on");        // ペンが触れた瞬間に録画開始を表示
    strokeStartPerf = performance.now();

    currentStroke = {
      index: strokes.length,
      pointerType: evt.pointerType, // "pen" / "touch" / "mouse"
      points: [makePoint(evt, xPx, yPx)],
    };

    if (!liveTickRunning) {
      liveTickRunning = true;
      requestAnimationFrame(tickLiveStats);
    }
  }

  function onPointerMove(evt) {
    if (activePointerId !== evt.pointerId) return;
    evt.preventDefault();

    // coalesced events が使えるブラウザなら、間引かれる前の点も拾う
    const events = (typeof evt.getCoalescedEvents === "function")
      ? evt.getCoalescedEvents()
      : [evt];

    for (const e of (events.length ? events : [evt])) {
      const [xPx, yPx] = getLocalPos(e);

      if (isInsideRuler(xPx, yPx)) {
        // ルーラーの内側: ステンシルのように描けない。今の下書きはここで確定し、
        // 外に出たら新しいストロークとして再開する（継ぎ目のワープを作らないため）。
        if (currentStroke && currentStroke.points.length > 1) {
          strokes.push(currentStroke);
          updateCounts();
        }
        currentStroke = null;
        continue;
      }

      if (!currentStroke) {
        // ルーラーの外に出た（またはこのmoveが最初の点）: 新しいストロークとして再開
        currentStroke = { index: strokes.length, pointerType: e.pointerType, points: [makePoint(e, xPx, yPx)] };
        continue;
      }

      const prev = currentStroke.points[currentStroke.points.length - 1];
      currentStroke.points.push(makePoint(e, xPx, yPx));
      drawSegment([prev.x_px, prev.y_px], [xPx, yPx]);
    }
  }

  function endStroke(evt) {
    if (activePointerId !== evt.pointerId) return;
    if (currentStroke && currentStroke.points.length > 1) {
      strokes.push(currentStroke);
    }
    currentStroke = null;
    activePointerId = null;
    recBadge.classList.remove("on");     // ペンが離れたら録画停止を表示
    updateCounts();
  }

  function updateCounts() {
    statusStrokeCount.textContent = strokes.length;
    const totalPoints = strokes.reduce((acc, s) => acc + s.points.length, 0);
    statusPointCount.textContent = totalPoints;
  }

  // ------------------------------------------------------------------
  // Family（複数シーケンスの積み上げ）
  // ------------------------------------------------------------------

  // 現在使われていない色を優先して割り当てる（削除・編集後に色がインデックスで
  // ズレて、無関係なSeq同士が同じ色に被ってしまう問題を避けるため）。
  // パレットを使い切ったらidベースで巡回する。
  function pickFamilyColor() {
    const used = new Set(family.map((m) => m.color));
    for (const c of FAMILY_COLORS) {
      if (!used.has(c)) return c;
    }
    return FAMILY_COLORS[familyIdCounter % FAMILY_COLORS.length];
  }

  function addToFamily() {
    if (editingId !== null) return; // 編集中は他の操作を禁止
    if (strokes.length === 0) {
      log("Familyに追加する下書きがありません");
      return;
    }
    // 現在下書き中の各ストロークを、それぞれ独立した1シーケンスとして昇格させる
    // (複数ストロークをまとめて1本の(T,2)に結合すると、ストローク間で
    //  ワープしたような不自然な区間ができてしまうため、別々のシーケンスにする)
    for (const s of strokes) {
      family.push({
        id: familyIdCounter++,
        color: pickFamilyColor(),
        pointerType: s.pointerType,
        points: s.points,
      });
    }
    const added = strokes.length;
    strokes = [];
    currentStroke = null;
    redrawAll();
    updateCounts();
    updateFamilyUI();
    log(`Familyに${added}件追加しました（合計${family.length}件）`);
  }

  function deleteFamilyMember(id) {
    if (editingId !== null || isPlaying) return; // 編集中・再生中は他を触れない
    family = family.filter((m) => m.id !== id);
    redrawAll();
    updateFamilyUI();
    log("Familyから1件削除しました");
  }

  // 編集開始: 対象を一旦Familyから取り出し、下書きキャンバスに載せる。
  // 完了(確定/キャンセル)するまで、他のFamily操作・＋・書き出しはすべて無効化する。
  function startEdit(id) {
    if (editingId !== null || isPlaying) return; // 二重編集・再生中の編集開始を禁止
    const idx = family.findIndex((m) => m.id === id);
    if (idx === -1) return;
    const m = family[idx];
    editingId = id;
    editingOriginal = { id: m.id, color: m.color, pointerType: m.pointerType, points: m.points, listIndex: idx };
    family.splice(idx, 1);
    strokes = [{ index: 0, pointerType: m.pointerType, points: m.points }];
    currentStroke = null;
    redrawAll();
    updateCounts();
    setEditModeUI(true);
    log(`Seq編集中: 描き直して「編集を確定」、やめる場合は「編集をキャンセル」を押してください`);
  }

  function confirmEdit() {
    if (editingId === null) return;
    if (strokes.length === 0) {
      log("編集後の描画が空です。描き直すか、キャンセルしてください");
      return;
    }
    // 最初のストロークが元のSeqを置き換える(id・色・表示順を維持)。
    // 編集中にさらにストロークを追加していた場合は、それらは新規Seqとして追加する。
    const [first, ...rest] = strokes;
    const insertAt = Math.min(editingOriginal.listIndex, family.length);
    family.splice(insertAt, 0, {
      id: editingOriginal.id,
      color: editingOriginal.color,
      pointerType: first.pointerType,
      points: first.points,
    });
    for (const s of rest) {
      family.push({ id: familyIdCounter++, color: pickFamilyColor(), pointerType: s.pointerType, points: s.points });
    }
    strokes = [];
    currentStroke = null;
    editingId = null;
    editingOriginal = null;
    redrawAll();
    updateCounts();
    setEditModeUI(false);
    log("編集を確定しました");
  }

  function cancelEdit() {
    if (editingId === null) return;
    const insertAt = Math.min(editingOriginal.listIndex, family.length);
    family.splice(insertAt, 0, {
      id: editingOriginal.id,
      color: editingOriginal.color,
      pointerType: editingOriginal.pointerType,
      points: editingOriginal.points,
    });
    strokes = [];
    currentStroke = null;
    editingId = null;
    editingOriginal = null;
    redrawAll();
    updateCounts();
    setEditModeUI(false);
    log("編集をキャンセルしました（元の内容に戻しました）");
  }

  function setEditModeUI(editing) {
    addBtn.style.display = editing ? "none" : "";
    editConfirmBtn.style.display = editing ? "" : "none";
    editCancelBtn.style.display = editing ? "" : "none";
    editBanner.style.display = editing ? "" : "none";
    editBanner.textContent = editing ? "編集中… 完了するまで他のSeqの編集・削除・書き出しはできません" : "";
    exportBtn.disabled = editing;
    playBtn.disabled = editing;
    modeDrawBtn.disabled = editing;
    modeRulerBtn.disabled = editing;
    rulerClearBtn.disabled = editing;
    updateFamilyUI();
  }

  // Family内の1シーケンスだけを、記録どおりの間隔で見るための再生（編集や削除はしない）
  async function playbackFamilyMember(id) {
    if (isPlaying || editingId !== null) return;
    const m = family.find((x) => x.id === id);
    if (!m || m.points.length < 2) return;

    isPlaying = true;
    setControlsEnabled(false);
    updateFamilyUI();
    redrawAll();

    let prev = null;
    for (const p of m.points) {
      if (prev) {
        await sleep(Math.max(0, p.t - prev.t));
        ctx.save();
        ctx.strokeStyle = m.color;
        ctx.globalAlpha = 1;
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(prev.x_px, prev.y_px);
        ctx.lineTo(p.x_px, p.y_px);
        ctx.stroke();
        ctx.restore();
      }
      prev = p;
    }

    isPlaying = false;
    setControlsEnabled(true);
    updateFamilyUI();
    redrawAll();
  }

  // 各Seqのサムネイル: そのシーケンス自身のバウンディングボックスに合わせて
  // 拡大縮小して描く（一覧で「どれがどれか」を一目で見分けるためのUIなので、
  // 正規化座標の絶対スケールは無視して見やすさを優先する）。
  function renderThumbnail(canvasEl, points, color) {
    const tctx = canvasEl.getContext("2d");
    const w = canvasEl.width, h = canvasEl.height;
    tctx.clearRect(0, 0, w, h);
    if (points.length < 2) return;

    const xs = points.map((p) => p.x_px), ys = points.map((p) => p.y_px);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const spanX = Math.max(maxX - minX, 1e-6), spanY = Math.max(maxY - minY, 1e-6);
    const pad = 5;
    const scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);
    const offX = pad + (w - 2 * pad - spanX * scale) / 2;
    const offY = pad + (h - 2 * pad - spanY * scale) / 2;

    tctx.strokeStyle = color;
    tctx.lineWidth = 2;
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    tctx.beginPath();
    points.forEach((p, i) => {
      const px = offX + (p.x_px - minX) * scale;
      const py = offY + (p.y_px - minY) * scale;
      if (i === 0) tctx.moveTo(px, py); else tctx.lineTo(px, py);
    });
    tctx.stroke();
  }

  function updateFamilyUI() {
    familyCountEl.textContent = family.length;
    const totalTimesteps = family.reduce((acc, m) => acc + m.points.length, 0);
    familyTimestepsEl.textContent = totalTimesteps;

    const locked = editingId !== null || isPlaying; // 編集中・再生中は一覧の操作を全ロック

    familyListEl.innerHTML = "";
    family.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "family-item" + (locked ? " editing-locked" : "");
      row.innerHTML = `
        <canvas class="thumb" width="80" height="80"></canvas>
        <span class="swatch" style="background:${m.color}"></span>
        <span class="label">Seq ${i}: ${m.points.length} timesteps</span>
        <button class="play" ${locked ? "disabled" : ""}>▶</button>
        <button class="edit" ${locked ? "disabled" : ""}>編集</button>
        <button class="del" ${locked ? "disabled" : ""}>削除</button>
      `;
      renderThumbnail(row.querySelector("canvas.thumb"), m.points, m.color);
      row.querySelector(".play").addEventListener("click", () => playbackFamilyMember(m.id));
      row.querySelector(".edit").addEventListener("click", () => startEdit(m.id));
      row.querySelector(".del").addEventListener("click", () => deleteFamilyMember(m.id));
      familyListEl.appendChild(row);
    });
  }

  // レコーディング中（ペンが触れている間）、経過時間とtimesteps数を
  // リアルタイムに更新し続けるループ。pointermoveの発火頻度に依存させないよう
  // requestAnimationFrameで独立に回す。
  function tickLiveStats() {
    // activePointerId自体は、ルーラーをまたいで一時的にcurrentStrokeがnullになっても
    // ペンが離れるまで維持されるので、ここではそれだけを終了条件にする。
    if (activePointerId === null) {
      liveTickRunning = false;
      return;
    }
    const elapsedSec = (performance.now() - strokeStartPerf) / 1000;
    statusElapsed.textContent = elapsedSec.toFixed(2);
    statusStrokeCount.textContent = strokes.length;

    const confirmedPoints = strokes.reduce((acc, s) => acc + s.points.length, 0);
    statusPointCount.textContent = confirmedPoints + (currentStroke ? currentStroke.points.length : 0);

    requestAnimationFrame(tickLiveStats);
  }

  // ------------------------------------------------------------------
  // ルーラーモード用のポインタ処理（形の描画・移動）
  // ------------------------------------------------------------------
  function onRulerPointerDown(evt) {
    if (isPlaying) return;
    if (rulerDragPointerId !== null) return;
    evt.preventDefault();
    canvas.setPointerCapture(evt.pointerId);
    rulerDragPointerId = evt.pointerId;
    const [xPx, yPx] = getLocalPos(evt);

    if (isInsideRuler(xPx, yPx)) {
      // ルーラーの内側を触った: そのまま動かす(移動)モード
      rulerDragMode = "move";
      rulerDragStart = { x: xPx, y: yPx };
      rulerOffsetStart = { x: ruler.offsetX, y: ruler.offsetY };
    } else {
      // ルーラーの外を触った: 新しい形を描き直す(既存のルーラーは確定時に置き換わる)
      rulerDragMode = "draw";
      rulerDraftPoints = [{ x_px: xPx, y_px: yPx }];
    }
    redrawAll();
  }

  function onRulerPointerMove(evt) {
    if (rulerDragPointerId !== evt.pointerId) return;
    evt.preventDefault();
    const [xPx, yPx] = getLocalPos(evt);

    if (rulerDragMode === "move") {
      ruler.offsetX = rulerOffsetStart.x + (xPx - rulerDragStart.x);
      ruler.offsetY = rulerOffsetStart.y + (yPx - rulerDragStart.y);
    } else if (rulerDragMode === "draw") {
      rulerDraftPoints.push({ x_px: xPx, y_px: yPx });
    }
    redrawAll();
  }

  function onRulerPointerUp(evt) {
    if (rulerDragPointerId !== evt.pointerId) return;
    if (rulerDragMode === "draw" && rulerDraftPoints && rulerDraftPoints.length > 2) {
      ruler = { points: rulerDraftPoints, offsetX: 0, offsetY: 0 };
      log("ルーラーの形を更新しました");
    }
    rulerDragPointerId = null;
    rulerDragMode = null;
    rulerDraftPoints = null;
    redrawAll();
  }

  // モードに応じて描画用/ルーラー用のハンドラに振り分ける
  function handlePointerDown(evt) {
    if (mode === "ruler") onRulerPointerDown(evt);
    else onPointerDown(evt);
  }
  function handlePointerMove(evt) {
    if (mode === "ruler") onRulerPointerMove(evt);
    else onPointerMove(evt);
  }
  function handlePointerUp(evt) {
    if (mode === "ruler") onRulerPointerUp(evt);
    else endStroke(evt);
  }

  canvas.addEventListener("pointerdown", handlePointerDown, { passive: false });
  canvas.addEventListener("pointermove", handlePointerMove, { passive: false });
  canvas.addEventListener("pointerup", handlePointerUp, { passive: false });
  canvas.addEventListener("pointercancel", handlePointerUp, { passive: false });
  canvas.addEventListener("pointerleave", (evt) => {
    // Pencilがcanvas外に出て離された場合もストロークを閉じる
    if (mode === "ruler") { if (rulerDragPointerId === evt.pointerId) onRulerPointerUp(evt); }
    else if (activePointerId === evt.pointerId) endStroke(evt);
  }, { passive: false });

  // Safariでのスクロール・ダブルタップズーム・スクリブル干渉を抑止
  canvas.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  // ------------------------------------------------------------------
  // 操作ボタン
  // ------------------------------------------------------------------
  document.getElementById("undoBtn").addEventListener("click", () => {
    strokes.pop();
    redrawAll();
    updateCounts();
    log("直前のストロークを取り消しました");
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    strokes = [];
    redrawAll();
    updateCounts();
    log("全ストロークを消去しました");
  });

  addBtn.addEventListener("click", addToFamily);
  editConfirmBtn.addEventListener("click", confirmEdit);
  editCancelBtn.addEventListener("click", cancelEdit);

  function setMode(newMode) {
    if (isPlaying || editingId !== null) return; // 再生中・編集中はモード変更不可
    mode = newMode;
    modeDrawBtn.classList.toggle("active", mode === "draw");
    modeRulerBtn.classList.toggle("active", mode === "ruler");
    wrap.classList.toggle("ruler-mode", mode === "ruler");
    log(mode === "draw"
      ? "描画モードに切り替えました"
      : "ルーラーモードに切り替えました（外側で形を描く/内側を触って移動できます）");
  }
  modeDrawBtn.addEventListener("click", () => setMode("draw"));
  modeRulerBtn.addEventListener("click", () => setMode("ruler"));
  rulerClearBtn.addEventListener("click", () => {
    if (isPlaying || editingId !== null) return;
    ruler = null;
    redrawAll();
    log("ルーラーを削除しました");
  });

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function setControlsEnabled(enabled) {
    undoBtn.disabled = !enabled;
    clearBtn.disabled = !enabled;
    addBtn.disabled = !enabled;
    exportBtn.disabled = !enabled;
    playBtn.disabled = !enabled;
    editConfirmBtn.disabled = !enabled;
    editCancelBtn.disabled = !enabled;
    modeDrawBtn.disabled = !enabled;
    modeRulerBtn.disabled = !enabled;
    rulerClearBtn.disabled = !enabled;
  }

  // 記録した実際のタイムスタンプ間隔どおりに再生し、キャプチャした軌跡の
  // 時間的な忠実さ（速く描いた/ゆっくり描いた、の再現）を目視確認するための機能。
  playBtn.addEventListener("click", async () => {
    if (isPlaying || editingId !== null || strokes.length === 0) {
      if (strokes.length === 0) log("再生するストロークがありません");
      return;
    }
    isPlaying = true;
    setControlsEnabled(false);
    updateFamilyUI();
    log("再生開始");

    ctx.clearRect(0, 0, cssSize, cssSize);
    drawGuides();
    for (const m of family) {
      drawPolyline(m.points, m.color, 0.35);
    }

    for (const s of strokes) {
      let prev = null;
      for (const p of s.points) {
        if (prev) {
          const wait = p.t - prev.t;
          await sleep(Math.max(0, wait));
          drawSegment([prev.x_px, prev.y_px], [p.x_px, p.y_px]);
        }
        prev = p;
      }
      await sleep(250); // ストローク間の一息（実際の間隔ではなく固定の短い間）
    }

    log("再生終了");
    isPlaying = false;
    setControlsEnabled(true);
    updateFamilyUI();
    redrawAll();
  });

  exportBtn.addEventListener("click", () => {
    if (family.length === 0) {
      log("書き出すFamilyがありません（＋で追加してください）");
      return;
    }
    if (strokes.length > 0) {
      log("注意: 下書き中の描画はFamilyに未追加です。含めたい場合は先に＋を押してください");
    }
    const payload = {
      meta: {
        app: "ipad-trajectory-capture",
        version: 2,
        recordedAt: new Date().toISOString(),
        label: labelInput.value || null,
        canvas: { size_px: cssSize, dpr: dpr },
        normalization: {
          target_range: [-TARGET_RANGE, TARGET_RANGE],
          x_formula: "x = (x_px - size/2) / (size/2) * 0.9",
          y_formula: "y = -(y_px - size/2) / (size/2) * 0.9  (画面下向きを反転し上向き正に)",
        },
        time: {
          unit: "ms",
          clock: "PointerEvent.timeStamp (performance.now()系, 単調増加の高分解能タイムスタンプ)",
          sampling: "native (未リサンプリング)。固定Hzへの変換は前処理スクリプト側で実施する想定。",
        },
        n_seq: family.length,
      },
      // family[i] が1シーケンス(T_i, 2)。前処理スクリプト側でpadding+maskして
      // (Nseq, Tmax, 2) または (Tmax, Nseq, 2) にまとめる想定。
      family: family.map((m, i) => ({
        seq: i,
        pointerType: m.pointerType,
        points: m.points,
      })),
    };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = payload.meta.recordedAt.replace(/[:.]/g, "-");
    a.href = url;
    a.download = `family_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    log(`書き出しました: ${family.length}シーケンス`);
  });

  // ------------------------------------------------------------------
  // 初期化
  // ------------------------------------------------------------------
  resizeCanvas();
  updateCounts();
  updateFamilyUI();
  log("準備完了。Apple Pencilで描いてください。");
})();
</script>
</body>
</html>
